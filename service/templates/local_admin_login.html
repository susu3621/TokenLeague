{% extends "base.html" %}

{% block title %}{{ t('local_admin.title') }} | {{ project_title }}{% endblock %}

{% block content %}
<section class="auth-panel">
    <h1>{{ t('local_admin.title') }}</h1>
    <p class="muted">{{ t('local_admin.description') }}</p>
    {% if error %}
    <p class="notice notice-error" role="alert">{{ error }}</p>
    {% endif %}
    <form method="POST" class="stack">
        <div>
            <label for="username">{{ t('login.username') }}</label>
            <input id="username" name="username" value="{{ request.form.get('username', 'admin') }}" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        </div>
        <div>
            <label for="password">{{ t('login.password') }}</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn-primary" type="submit">{{ t('local_admin.submit') }}</button>
    </form>
</section>
{% endblock %}
